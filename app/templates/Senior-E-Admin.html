<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Senior E-Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f9fb; }
        .admin-header { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #eee; padding: 32px 24px; margin: 48px auto; max-width: 1200px;}
        .table thead { background: #f0f2f5; }
        .btn-primary { background: #0056b3; border: none; }
        .btn-primary:hover { background: #003d80; }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">E-DBA Senior E-Admin Panel</a>
            <div class="d-flex">
                <span class="navbar-text me-3" id="adminName">Senior E-Admin</span>
                <a href="/user/login" class="btn btn-outline-secondary btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Final Approval Management -->
        <div class="admin-header">
            <h2 class="mb-3">Final Approval Management</h2>
            <div id="msgBox"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Application ID</th>
                            <th>Organization (Full)</th>
                            <th>Organization (Short)</th>
                            <th>Convener Email</th>
                            <th>Status</th>
                            <th>Proof</th>
                            <th>Submitted At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="finalApprovalTableBody">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showMsg(msg, type="info") {
            document.getElementById('msgBox').innerHTML =
                `<div class="alert alert-${type}" role="alert">${msg}</div>`;
        }

        // Final Approval Management
        function loadFinalApprovals() {
            fetch('/senior_admin/senior_admin/final-approvals')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('finalApprovalTableBody');
                tbody.innerHTML = '';
                if (data.status === 'success' && data.data.length > 0) {
                    data.data.forEach(reg => {
                        tbody.innerHTML += `
                        <tr>
                            <td>${reg.registrationID}</td>
                            <td>${reg.organizationNameInFull}</td>
                            <td>${reg.organizationNameInShort}</td>
                            <td>${reg.convenerEmail}</td>
                            <td>
                                <span class="badge ${reg.status === 'Approved' ? 'bg-success' : 'bg-danger'}">
                                    ${reg.status}
                                </span>
                            </td>
                            <td>
                                <a href="/senior_admin/senior_admin/registration/${reg.registrationID}/proof" target="_blank" class="btn btn-sm btn-outline-info">View PDF</a>
                            </td>
                            <td>${reg.submittedAt}</td>
                            <td>
                                ${reg.status === 'Approved' ? `
                                    <button class="btn btn-sm btn-success me-1" onclick="finalApproveApplication(${reg.registrationID})">Final Approve</button>
                                    <button class="btn btn-sm btn-danger" onclick="finalRejectApplication(${reg.registrationID})">Final Reject</button>
                                ` : ''}
                            </td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">No applications pending final approval.</td></tr>';
                }
            });
        }

        function finalApproveApplication(id) {
            fetch(`/senior_admin/senior_admin/registration/${id}/final-approve`, {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                showMsg(data.message, data.status === 'success' ? 'success' : 'danger');
                loadFinalApprovals();
            });
        }

        function finalRejectApplication(id) {
            fetch(`/senior_admin/senior_admin/registration/${id}/final-reject`, {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                showMsg(data.message, data.status === 'success' ? 'success' : 'danger');
                loadFinalApprovals();
            });
        }

        window.onload = function() {
            loadFinalApprovals();
        };
    </script>
</body>
</html>
